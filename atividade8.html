<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="atividade8.css">
        <title>Pokémon</title>
    </head>
    <body>
        
        <div class="titulo">
            <h1>Aventura Pokémon</h1>
            
            <div class="entrada">
                <input type="text" id="adicionar" placeholder="Digite o nome de um Pokémon">/* cria um campo*/
                <button id="Procurar">Procurar Pokémon</button>
            </div>
            <ul id="lista"></ul>
        </div>
        
        <script>
        
        const input = document.getElementById('adicionar'); /* Busca o campo de texto pelo ID adicionar */
        const botao = document.getElementById('Procurar');
        const lista = document.getElementById('lista');
        
        async function procurarPokemon() {/* Cria uma função responsável por pesquisar os Pokémon */
            
            const nome = input.value.trim().toLowerCase();
            if (nome === '') {
                alert('Digite o nome de um Pokémon!');
            }
            lista.innerHTML = '<li>Pesquisando...</li>';
            try {
                const resposta = await fetch(
                    `https://pokeapi.co/api/v2/pokemon/${nome}` /* Faz uma requisição */         
                );
                
                if (!resposta.ok) {
                    if (resposta.status === 404) {
                        lista.innerHTML = '<li>Pokémon não encontrado!</li>';
                        return;
                    }
                    
                    throw new Error('Erro ao acessar a API');
                }
                
                const dados = await resposta.json();
                lista.innerHTML = '';
            
                const informacoes = [
                    
                'Nome: ' + dados.name,/* Adiciona o nome do Pokémon */
                'ID: ' + dados.id,
                'Altura: ' + dados.height / 10 + ' metros',
                'Peso: ' + dados.weight / 10 + ' kg',
                'Habilidades: ' + dados.abilities 
                .map(item => item.ability.name)
                .join(', ')
                ];
                
                informacoes.forEach(function(informacao) {
                    const li = document.createElement('li');
                    li.textContent = informacao;
                    lista.appendChild(li);
                });
            } catch (erro) {
                lista.innerHTML = '<li>Erro na comunicação com a API!</li>';
                console.log(erro);
            }
        }
        botao.addEventListener('click', procurarPokemon);
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                procurarPokemon();
            }
        });
        </script>
    </body>
</html>
